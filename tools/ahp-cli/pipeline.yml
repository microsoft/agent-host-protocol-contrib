name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    exclude:
      - "*"
  tags:
    include:
      - cli/v*
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: agent-host-protocol-cli
        workingDirectory: tools/ahp-cli
        nodeVersion: 22.x
        ghCreateTag: false
        ghTagPrefix: cli/v
        tag: latest
        # The shared template only publishes latest on manually queued runs.
        publishPackage: true
        skipAPIScan: true

        buildSteps:
          - bash: |
              set -euo pipefail
              REF="$(Build.SourceBranch)"
              PKG_VERSION=$(node -p "require('./tools/ahp-cli/package.json').version")
              if ! grep -qF "## [$PKG_VERSION]" tools/ahp-cli/CHANGELOG.md; then
                echo "##vso[task.logissue type=error]tools/ahp-cli/CHANGELOG.md is missing a release entry for $PKG_VERSION."
                exit 1
              fi
              case "$REF" in
                refs/tags/cli/v*)
                  TAG_VERSION="${REF#refs/tags/cli/v}"
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "##vso[task.logissue type=error]Tag version ($TAG_VERSION) does not match tools/ahp-cli/package.json version ($PKG_VERSION)."
                    exit 1
                  fi
                  ;;
                refs/tags/*)
                  echo "##vso[task.logissue type=error]The CLI pipeline only accepts cli/vX.Y.Z release tags."
                  exit 1
                  ;;
                *)
                  echo "Manual CLI release of $PKG_VERSION."
                  ;;
              esac
            displayName: Verify release version and changelog

          - script: npm ci
            workingDirectory: tools/ahp-cli
            displayName: Install CLI dependencies

          - script: npm run build
            workingDirectory: tools/ahp-cli
            displayName: Build standalone CLI bundle

        testPlatforms:
          - name: Linux
            nodeVersions:
              - 22.x
              - 24.x

        testSteps:
          - script: npm ci
            workingDirectory: tools/ahp-cli
            displayName: Install CLI dependencies

          - script: npm test
            workingDirectory: tools/ahp-cli
            displayName: Test CLI, controllers, and standalone npm artifact

[workspace]
resolver = "2"
members = [
    "crates/openai-agent-model",
    "crates/deterministic-openai",
    "crates/workspace-agent-tools",
    "crates/ahp-server-core",
    "crates/ahp-server-ws",
    "crates/ahp-server-redb",
    "samples/rust/minimal-chat-host",
    "samples/rust/advanced-workspace-host",
    "tools/deterministic-openai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/microsoft/agent-host-protocol-samples"

[workspace.dependencies]
ahp-types = "1.0.0"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
futures-util = "0.3"
globset = "0.4"
notify = "8"
httparse = "1"
libc = "0.2"
redb = "2.6.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
